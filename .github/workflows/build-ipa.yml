name: Build iOS IPA

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      sign:
        description: "IPA signieren (benötigt die Signing-Secrets)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PROJECT: PVEScripts.xcodeproj
      SCHEME: PVEScripts
      APP_NAME: PVEScripts
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.kernelguru.pvescripts' }}
      # Optional: Signing. Wenn diese Secrets fehlen, wird nur eine unsignierte IPA gebaut.
      HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versionen ermitteln
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E '^\s+MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Version $VERSION (Build $GITHUB_RUN_NUMBER)"
          xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        run: xcodegen generate --spec project.yml

      - name: SwiftPM-Cache
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pakete auflösen
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Archiv bauen (ohne Signatur)
        run: |
          set -o pipefail
          FORMATTER=cat
          command -v xcbeautify >/dev/null && FORMATTER="xcbeautify --renderer github-actions"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" | $FORMATTER

      - name: Unsignierte IPA packen
        run: |
          APP="build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          test -d "$APP" || { echo "::error::$APP nicht gefunden"; exit 1; }
          mkdir -p dist/unsigned/Payload
          cp -R "$APP" dist/unsigned/Payload/
          (cd dist/unsigned && zip -qry "../$APP_NAME-$VERSION-$BUILD_NUMBER-unsigned.ipa" Payload)
          rm -rf dist/unsigned
          ls -la dist

      - name: Signieren (optional)
        if: env.HAS_SIGNING == 'true' && (github.event_name != 'workflow_dispatch' || inputs.sign)
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Zertifikat in temporären Schlüsselbund importieren
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "${P12_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')"
          test -n "$IDENTITY" || { echo "::error::Keine Signatur-Identität im Zertifikat gefunden"; exit 1; }

          # Provisioning-Profil auswerten
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          PROFILE_BUNDLE="${APP_ID#"$TEAM_ID".}"
          if [[ "$PROFILE_BUNDLE" == *"*"* ]]; then
            SIGN_BUNDLE="$BUNDLE_ID"
            /usr/libexec/PlistBuddy -c "Set :application-identifier $TEAM_ID.$SIGN_BUNDLE" "$RUNNER_TEMP/entitlements.plist"
          else
            SIGN_BUNDLE="$PROFILE_BUNDLE"
          fi
          echo "Signiere als $SIGN_BUNDLE (Team $TEAM_ID)"

          # App kopieren, Profil einbetten, signieren
          WORK="$RUNNER_TEMP/signed"
          mkdir -p "$WORK/Payload"
          cp -R "build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" "$WORK/Payload/"
          APP="$WORK/Payload/$APP_NAME.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $SIGN_BUNDLE" "$APP/Info.plist"
          cp "$PROFILE" "$APP/embedded.mobileprovision"

          find "$APP" -depth \( -name '*.framework' -o -name '*.dylib' -o -name '*.appex' \) -print0 |
            while IFS= read -r -d '' item; do
              codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "$item"
            done
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" \
            --entitlements "$RUNNER_TEMP/entitlements.plist" --generate-entitlement-der --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          (cd "$WORK" && zip -qry "$GITHUB_WORKSPACE/dist/$APP_NAME-$VERSION-$BUILD_NUMBER.ipa" Payload)
          security delete-keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12" "$PROFILE"
          ls -la dist

      - name: IPA als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.VERSION }}-${{ env.BUILD_NUMBER }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: GitHub-Release erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
          generate_release_notes: true
