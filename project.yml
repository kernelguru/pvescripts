name: PVEScripts
options:
  bundleIdPrefix: com.kernelguru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.10.1
  # Transitive dependencies of Citadel, listed explicitly so the app can
  # import NIOSSH / NIOCore types (host-key validation, PTY requests).
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0

targets:
  PVEScripts:
    type: application
    platform: iOS
    sources:
      - path: PVEScripts
    dependencies:
      - package: Citadel
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
    info:
      path: PVEScripts/Info.plist
      properties:
        CFBundleDisplayName: PVE Scripts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: PVE Scripts verbindet sich per SSH mit deinem Proxmox-Host im lokalen Netzwerk.
        UISupportsDocumentBrowser: false
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kernelguru.pvescripts
        PRODUCT_NAME: PVEScripts
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    scheme: {}
